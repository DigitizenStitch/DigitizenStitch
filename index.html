<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#172554" />
    <!--seo-->
    <title>Digitize'NStitch | Embroidery Digitizing, Vector Art &amp; Patches</title>
    <meta name="description" content="Production-ready embroidery digitizing from $10, clean vector art from $12 and patch digitizing from $10. Free revisions, 2-hour rush available. Serving clients worldwide." />
    <!--/seo-->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Digitize'NStitch" />
    <meta property="og:image" content="https://digitizenstitch.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Digitize'NStitch: Embroidery Digitizing, Vector Art and Patches" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://digitizenstitch.com/og-image.jpg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Enable scroll-reveal styles only when JS runs and motion is allowed.
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('js-motion');
    </script>
  </head>
  <body>
    <div id="root"><!--app--></div>

    <!-- Static copy of the quote form so Netlify Forms detects all fields at deploy time. -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <select name="service"><option>Embroidery Digitizing</option></select>
      <input type="file" name="artwork" />
      <input type="text" name="design_size" />
      <select name="file_format"><option>DST</option></select>
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
