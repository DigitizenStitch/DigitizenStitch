# Pins the build so every page is prerendered (see scripts/prerender.js).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Emails every quote form submission (see netlify/functions/submission-created.mjs)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
